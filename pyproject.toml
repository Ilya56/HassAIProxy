[project]
name = "homeassistant_proxy"
version = "0.1.0"
description = "Narrow Home Assistant proxy API for GPT Actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "ruamel.yaml>=0.18.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeassistant_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

